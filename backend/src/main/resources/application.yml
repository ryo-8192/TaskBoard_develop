spring:
  application:
    name: taskboard-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/taskboard}
    username: ${DB_USERNAME:taskboard}
    password: ${DB_PASSWORD:taskboard}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
